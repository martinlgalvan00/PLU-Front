    <script>
      /* Tema antes del primer paint. Sin esto el documento pinta el default
         (dark) y recién al ejecutar main.jsx cambia a light: con la transición
         de tema activa, ese salto se ve como un flash animado en cada carga.
         Misma lógica que src/lib/theme.js (resolveTheme('system')). */
      ;(function () {
        try {
          var stored = localStorage.getItem('plu-arg-theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
