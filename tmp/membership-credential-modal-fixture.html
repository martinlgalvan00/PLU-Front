<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Membership credential modal fixture</title>
    <link rel="stylesheet" href="../src/styles/tokens/palette.css" />
    <link rel="stylesheet" href="../src/styles/variables.css" />
    <link rel="stylesheet" href="../src/styles/themes/dark.css" />
    <link rel="stylesheet" href="../src/styles/pages/admin-audit.css" />
    <style>
      body {
        background: #0b0d12;
        color: #f4f5f7;
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="membership-credential-modal">
      <button type="button" class="membership-credential-modal__backdrop" aria-label="Cerrar"></button>
      <div
        class="membership-credential-modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="membership-credential-modal-title"
      >
        <header class="membership-credential-modal__head">
          <div class="membership-credential-modal__who">
            <span class="membership-credential-modal__eyebrow">Credencial del socio</span>
            <h2 id="membership-credential-modal-title" class="membership-credential-modal__title">
              Test Athlete 1
            </h2>
            <p class="membership-credential-modal__lead">
              QR de puerta y datos de la afiliación emitida.
            </p>
          </div>
          <button type="button" class="membership-credential-modal__close" aria-label="Cerrar">
            ×
          </button>
        </header>
        <div class="admin-credential admin-credential--modal">
          <div class="admin-credential__qr">
            <span class="admin-credential__qr-placeholder">QR</span>
          </div>
          <div class="admin-credential__data">
            <dl class="admin-credential__rows">
              <div>
                <dt>Código</dt>
                <dd>PLU-ARG-2026-00000003</dd>
              </div>
              <div>
                <dt>Estado</dt>
                <dd>Cancelada</dd>
              </div>
              <div>
                <dt>Vencimiento</dt>
                <dd>21 de jul de 2027</dd>
              </div>
              <div>
                <dt>Documento</dt>
                <dd>36151647</dd>
              </div>
            </dl>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
