name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  # Separar push y pull_request: un push a `dev` también sincroniza el PR
  # permanente `dev -> main`. Si comparten grupo, uno cancela al otro a los
  # pocos segundos y GitHub marca el commit en rojo por checks cancelled.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    # En push a `dev` el PR permanente ya corre este job; no duplicar runners.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Show toolchain
        run: |
          node -v
          npm -v
      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! npm ci; then
            echo "::error title=Lockfile desincronizado::package.json y package-lock.json no coinciden. Con Node $(cat .nvmrc): npm install && npm run lock:check && git add package-lock.json"
            exit 1
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Reject local API URLs in production assets
        run: |
          if grep -RE "https?://(localhost|127\\.0\\.0\\.1|\\[::1\\]):(3001|5173)" dist; then
            echo "El build contiene una URL local de la aplicación."
            exit 1
          fi
      - name: Validate Prisma schema
        env:
          # `prisma validate` parses the datasource URL but does not connect.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npx prisma validate

  supabase-integration:
    # Misma regla que `application`: en push a `dev` lo cubre el PR permanente.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Reject duplicated migration versions
        run: |
          # El timestamp del archivo es la PK de supabase_migrations.schema_migrations.
          # Dos archivos con el mismo prefijo hacen fallar `db reset` con 23505 y dejan
          # la segunda migración sin aplicar, acá y en la base hosteada.
          set -euo pipefail
          dupes=$(ls supabase/migrations | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)
          if [[ -n "$dupes" ]]; then
            echo "::error title=Versiones de migración duplicadas::$dupes. Renombrá el archivo más nuevo con un timestamp libre."
            exit 1
          fi
      - run: supabase start
      - run: supabase db reset
      - name: Lint Supabase schemas
        run: supabase db lint --local --fail-on warning
      - name: Export Supabase local connection as env vars
        run: |
          # supabase:assert pide URL/key de servidor Y de browser (VITE_*).
          # Un solo sed sobre API_URL no puede emitir dos vars: el primero
          # reescribe la línea y el segundo ya no matchea.
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_DATABASE_URL=${DB_URL}"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! npm ci; then
            echo "::error title=Lockfile desincronizado::package.json y package-lock.json no coinciden. Con Node $(cat .nvmrc): npm install && npm run lock:check && git add package-lock.json"
            exit 1
          fi
      - name: Assert Supabase connectivity
        run: npm run supabase:assert
      - run: npm run test:integration
      - run: npm run db:verify:payments
      # Postura de seguridad contra el catalogo real: RLS activo, el navegador
      # sin escritura, las RPC de cobro cerradas y toda funcion definer con
      # search_path. Los tests estaticos auditan lo que dicen las migraciones;
      # esto, lo que la base terminó teniendo puesto.
      - run: npm run db:verify:schema

  integrations-live:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check live integration secrets
        id: secrets
        env:
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${MERCADO_PAGO_ACCESS_TOKEN:-}" ]] || missing+=("MERCADO_PAGO_ACCESS_TOKEN")
          [[ -n "${BREVO_API_KEY:-}" ]] || missing+=("BREVO_API_KEY")
          [[ -n "${BREVO_SENDER_EMAIL:-}" ]] || missing+=("BREVO_SENDER_EMAIL")
          if ((${#missing[@]})); then
            echo "::warning title=Secrets de integraciones ausentes::Faltan ${missing[*]}. Se omite el smoke live de MP/Brevo; el resto del CI sigue. Cargalos en Settings → Secrets and variables → Actions cuando estén listos."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if ! npm ci; then
            echo "::error title=Lockfile desincronizado::package.json y package-lock.json no coinciden. Con Node $(cat .nvmrc): npm install && npm run lock:check && git add package-lock.json"
            exit 1
          fi
      - name: Mercado Pago connectivity
        if: steps.secrets.outputs.ready == 'true'
        env:
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
        run: npm run mercado-pago:doctor
      - name: Brevo connectivity
        if: steps.secrets.outputs.ready == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: npm run email:doctor
