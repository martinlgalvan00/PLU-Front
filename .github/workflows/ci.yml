name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  # Un push a dev también sincroniza el PR permanente dev -> main. Ambos
  # eventos comparten head.ref/ref_name y se consolidan en una sola corrida.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Show toolchain
        run: |
          node -v
          npm -v
      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! npm ci; then
            echo "::error title=Lockfile desincronizado::package.json y package-lock.json no coinciden. Con Node $(cat .nvmrc): npm install && npm run lock:check && git add package-lock.json"
            exit 1
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Reject local API URLs in production assets
        run: |
          if grep -RE "https?://(localhost|127\\.0\\.0\\.1|\\[::1\\]):(3001|5173)" dist; then
            echo "El build contiene una URL local de la aplicación."
            exit 1
          fi
      - name: Validate Prisma schema
        env:
          # `prisma validate` parses the datasource URL but does not connect.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npx prisma validate

  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db reset
      - name: Lint Supabase schemas
        run: supabase db lint --local --fail-on warning
      - name: Export Supabase local connection as env vars
        run: |
          supabase status -o env | sed -n \
            's/^API_URL="\(.*\)"$/SUPABASE_URL=\1/p;
             s/^SERVICE_ROLE_KEY="\(.*\)"$/SUPABASE_SERVICE_ROLE_KEY=\1/p;
             s/^DB_URL="\(.*\)"$/SUPABASE_DATABASE_URL=\1/p' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! npm ci; then
            echo "::error title=Lockfile desincronizado::package.json y package-lock.json no coinciden. Con Node $(cat .nvmrc): npm install && npm run lock:check && git add package-lock.json"
            exit 1
          fi
      - run: npm run test:integration
      - run: npm run db:verify:payments
