name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate Prisma schema
        env:
          # `prisma validate` parses the datasource URL but does not connect.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npx prisma validate

  supabase-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - name: Export Supabase local connection as env vars
        run: |
          supabase status -o env | sed -n \
            's/^API_URL="\(.*\)"$/SUPABASE_URL=\1/p;
             s/^SERVICE_ROLE_KEY="\(.*\)"$/SUPABASE_SERVICE_ROLE_KEY=\1/p;
             s/^DB_URL="\(.*\)"$/SUPABASE_DATABASE_URL=\1/p' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run db:verify:payments
