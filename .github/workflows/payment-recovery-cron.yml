name: Payment recovery cron

# Vercel Hobby solo permite una ejecución diaria por cron job
# (ver tests/deploymentConfig.test.js), así que el cron nativo de
# /api/internal/jobs/payment-recovery en vercel.json queda una vez por día
# como red de contención mínima. Este workflow lo complementa disparando el
# mismo endpoint cada 15 minutos desde afuera, para acortar la ventana en la
# que una orden puede quedar sin reconciliar si el webhook de Mercado Pago
# nunca llega.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disparar recuperación de pagos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en este repo (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 5 --max-time 20 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.powerliftingunited.ar/api/internal/jobs/payment-recovery"
