name: Payment revalidation cron

# Vercel Hobby solo permite una ejecución diaria por cron job
# (ver tests/deploymentConfig.test.js), así que el cron nativo de
# /api/internal/jobs/payment-revalidation en vercel.json queda una vez por
# día como red de contención mínima. Este workflow lo complementa disparando
# el mismo endpoint cada hora desde afuera, para acortar la ventana en la que
# una orden puede quedar cancelada/rechazada localmente mientras el pago ya
# está aprobado en Mercado Pago (checkout redirigido sin webhook y sin
# retorno del atleta al sitio).

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disparar revalidación de pagos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en este repo (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 5 --max-time 20 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.powerliftingunited.ar/api/internal/jobs/payment-revalidation"
