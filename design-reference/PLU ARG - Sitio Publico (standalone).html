  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 }}\" style=\"text-decoration:none; font-size:13px; font-weight:300; color:oklch(80% 0.006 260);\">Afiliación anual<\u002Fa>\n        <a href=\"javascript:void(0)\" onclick=\"{{ goPitbull }}\" style=\"text-decoration:none; font-size:13px; font-weight:300; color:oklch(80% 0.006 260);\">Pitbull Classic<\u002Fa>\n        <a href=\"javascript:void(0)\" onclick=\"{{ goEventos }}\" style=\"text-decoration:none; font-size:13px; font-weight:300; color:oklch(80% 0.006 260);\">Eventos<\u002Fa>\n        <a href=\"javascript:void(0)\" onclick=\"{{ goResultados }}\" style=\"text-decoration:none; font-size:13px; font-weight:300; color:oklch(80% 0.006 260);\">Resultados<\u002Fa>\n        <a href=\"javascript:void(0)\" onclick=\"{{ goReglamento }}\" style=\"text-decoration:none; font-size:13px; font-weight:300; color:oklch(80% 0.006 260);\">Reglamento<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:oklch(48% 0.006 260); margin-bottom:14px;\">Comunidad<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:11px;\">\n        <a href=\"javascript:void(0)\" onclick=\"{{ goComunidad }}\" style=\"text-decoration:none; font-size:13px; font-weight:300; color:oklch(80% 0.006 260);\">Comunidad<\u002Fa>\n        <a href=\"javascript:void(0)\" onclick=\"{{ goFaq }}\" style=\"text-decoration:none; font-size:13px; font-weight:300; color:oklch(80% 0.006 260);\">Preguntas frecuentes<\u002Fa>\n        <a href=\"javascript:void(0)\" onclick=\"{{ goContacto }}\" style=\"text-decoration:none; font-size:13px; font-weight:300; color:oklch(80% 0.006 260);\">Contacto<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:oklch(48% 0.006 260); margin-bottom:14px;\">Acceso<\u002Fdiv>\n      <a href=\"javascript:void(0)\" onclick=\"{{ goLogin }}\" style=\"text-decoration:none; font-size:13px; font-weight:300; color:oklch(80% 0.006 260);\">Ingresar a la plataforma<\u002Fa>\n      <div style=\"font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:oklch(48% 0.006 260); margin:20px 0 8px;\">Contacto directo<\u002Fdiv>\n      <div style=\"font-size:13px; font-weight:300; color:oklch(80% 0.006 260); line-height:1.7;\">hola@pluarg.com.ar<br>Buenos Aires, Argentina<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1280px; margin:40px auto 0; padding-top:20px; border-top:1px solid oklch(20% 0.006 260); display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;\">\n    <span style=\"font-size:11.5px; font-weight:300; color:oklch(42% 0.006 260);\">© 2026 PLU ARG / Maximal. Todos los derechos reservados.<\u002Fspan>\n    <span style=\"font-size:11.5px; font-weight:300; color:oklch(42% 0.006 260);\">Reconocida por PLU USA<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    page: 'home', menuOpen: false, isMobile: false, motivo: 'atleta', sent: false, faq: {},\n    dropdownOpen: null, navScrolled: false, indicator: { left: 0, width: 0, visible: false },\n    eventFilter: 'todos', calMonthOffset: 0, loggedIn: false,\n  };\n\n  componentDidMount() {\n    this.measure();\n    this._onResize = () => { this.measure(); this.measureIndicator(); };\n    window.addEventListener('resize', this._onResize);\n\n    this._onScroll = () => {\n      const scrolled = window.scrollY > 18;\n      if (scrolled !== this.state.navScrolled) this.setState({ navScrolled: scrolled });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n\n    this._onDocClick = (e) => {\n      const navRow = document.querySelector('[data-nav-row]');\n      if (this.state.dropdownOpen && navRow && !navRow.contains(e.target)) {\n        this.setState({ dropdownOpen: null });\n      }\n    };\n    document.addEventListener('click', this._onDocClick);\n\n    this._onKeyDown = (e) => {\n      if (e.key === 'Escape') this.setState({ dropdownOpen: null, menuOpen: false });\n    };\n    document.addEventListener('keydown', this._onKeyDown);\n\n    requestAnimationFrame(() => this.measureIndicator());\n\n    this._revealObserver = new IntersectionObserver((entries) => {\n      entries.forEach(entry => {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          this._revealObserver.unobserve(entry.target);\n        }\n      });\n    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });\n    this.scanReveals();\n  }\n\n  scanReveals() {\n    requestAnimationFrame(() => {\n      document.querySelectorAll('[data-reveal]:not(.is-visible)').forEach(el => {\n        if (this._revealObserver) this._revealObserver.observe(el);\n        // Safety net: guarantee visibility even if the observer never fires.\n        setTimeout(() => el.classList.add('is-visible'), 1200);\n      });\n    });\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState.page !== this.state.page) this.scanReveals();\n  }\n\n  componentWillUnmount() {\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._onDocClick) document.removeEventListener('click', this._onDocClick);\n    if (this._onKeyDown) document.removeEventListener('keydown', this._onKeyDown);\n    if (this._revealObserver) this._revealObserver.disconnect();\n  }\n\n  measure() {\n    const isMobile = window.innerWidth < 900;\n    if (isMobile !== this.state.isMobile) {\n      this.setState({ isMobile, menuOpen: isMobile ? this.state.menuOpen : false });\n      setTimeout(() => this.measureIndicator(), 60);\n    }\n  }\n\n  groupForPage(p) {\n    return ({\n      afiliacion: 'afiliacion',\n      pitbull: 'eventos', eventos: 'eventos', resultados: 'eventos',\n      reglamento: 'recursos', comunidad: 'recursos', faq: 'recursos',\n    })[p] || null;\n  }\n\n  measureIndicator = () => {\n    if (this.state.isMobile) {\n      if (this.state.indicator.visible) this.setState({ indicator: { left: 0, width: 0, visible: false } });\n      return;\n    }\n    const key = this.groupForPage(this.state.page);\n    const navRow = document.querySelector('[data-nav-row]');\n    const node = key && navRow ? navRow.querySelector('[data-nav-item=\"' + key + '\"]') : null;\n    if (!node || !navRow) {\n      if (this.state.indicator.visible) this.setState({ indicator: { left: 0, width: 0, visible: false } });\n      return;\n    }\n    const containerRect = navRow.getBoundingClientRect();\n    const rect = node.getBoundingClientRect();\n    this.setState({ indicator: { left: rect.left - containerRect.left, width: rect.width, visible: true } });\n  };\n\n  toggleMenu = () => this.setState(s => ({ menuOpen: !s.menuOpen }));\n\n  toggleDropdown = (key) => this.setState(s => ({ dropdownOpen: s.dropdownOpen === key ? null : key }));\n\n  goTo = (page) => {\n    this.setState({ page, menuOpen: false, dropdownOpen: null });\n    setTimeout(() => this.measureIndicator(), 60);\n    if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo({ top: 0, behavior: 'smooth' });\n  };\n\n  setMotivo = (m) => this.setState({ motivo: m });\n  send = () => this.setState({ sent: true });\n\n  toggleFaq = (id) => this.setState(s => ({ faq: { ...s.faq, [id]: !s.faq[id] } }));\n  setEventFilter = (f) => this.setState({ eventFilter: f });\n  doLogin = () => { this.setState({ loggedIn: true }); this.goTo('cuenta'); };\n  doLogout = () => { this.setState({ loggedIn: false }); this.goTo('home'); };\n  shiftCalMonth = (dir) => this.setState(s => ({ calMonthOffset: s.calMonthOffset + dir }));\n\n  renderVals() {\n    const p = this.state.page;\n    const on = 'oklch(78% 0.06 230)';\n    const off = 'oklch(85% 0.006 260)';\n    const loginTwoCol = !this.state.isMobile;\n\n    // --- Calendario (Agosto 2026 como base, dato de ejemplo) ---\n    const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];\n    const baseYear = 2026, baseMonth = 11; // Diciembre (0-indexed)\n    let calMonth = baseMonth + this.state.calMonthOffset;\n    let calYear = baseYear;\n    while (calMonth > 11) { calMonth -= 12; calYear += 1; }\n    while (calMonth < 0) { calMonth += 12; calYear -= 1; }\n    const firstDay = new Date(calYear, calMonth, 1).getDay();\n    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();\n    const isEventMonth = (calMonth === baseMonth && calYear === baseYear);\n    const calCells = [];\n    for (let i = 0; i < firstDay; i++) calCells.push({ blank: true });\n    for (let d = 1; d <= daysInMonth; d++) calCells.push({ day: d, isEvent: isEventMonth && (d === 12 || d === 13) });\n    const calWeekdays = ['D','L','M','M','J','V','S'];\n\n    const eventFilterKeys = ['todos', 'abierta', 'proximamente', 'finalizados'];\n    const eventFilterBg = {}, eventFilterColor = {}, eventFilterSet = {};\n    eventFilterKeys.forEach(k => {\n      const active = this.state.eventFilter === k;\n      eventFilterBg[k] = active ? 'oklch(20% 0.006 260)' : 'transparent';\n      eventFilterColor[k] = active ? '#fff' : 'oklch(30% 0.006 260)';\n      eventFilterSet[k] = () => this.setEventFilter(k);\n    });\n    // Único evento cargado hoy es \"Próximamente\" -> se oculta si el filtro elige otro estado.\n    const showPitbullCard = this.state.eventFilter === 'todos' || this.state.eventFilter === 'proximamente';\n\n    const faqIds = ['h1', 'h2', 'h3', 'a1', 'a2', 'f1', 'f2', 'f3', 'f4', 'f5', 'f6', 'f7', 'f8'];\n    const faqOpen = {}, faqToggle = {}, faqChevron = {};\n    faqIds.forEach(id => {\n      const isOpen = !!this.state.faq[id];\n      faqOpen[id] = isOpen;\n      faqChevron[id] = isOpen ? 'rotate(90deg)' : 'rotate(0deg)';\n      faqToggle[id] = () => this.toggleFaq(id);\n    });\n\n    const active = 'oklch(56% 0.18 25)';\n    const activeText = '#fff';\n    const offBg = 'oklch(98% 0.003 80)';\n    const offText = 'oklch(30% 0.006 260)';\n    const offBorder = 'oklch(84% 0.004 260)';\n    const key = this.state.motivo;\n    const pillFor = (k) => ({\n      bg: key === k ? active : offBg,\n      color: key === k ? activeText : offText,\n      border: key === k ? active : offBorder,\n    });\n    const a = pillFor('atleta'), g = pillFor('gimnasio'), o = pillFor('organizacion'), pu = pillFor('pluusa');\n\n    const activeGroup = this.groupForPage(p);\n    const dropdownOpen = this.state.dropdownOpen;\n\n    return {\n      isHome: p === 'home',\n      isAfiliacion: p === 'afiliacion',\n      isPitbull: p === 'pitbull',\n      isEventos: p === 'eventos',\n      isResultados: p === 'resultados',\n      isReglamento: p === 'reglamento',\n      isComunidad: p === 'comunidad',\n      isFaq: p === 'faq',\n      isContacto: p === 'contacto',\n      isLogin: p === 'login',\n      isCuenta: p === 'cuenta',\n      showChrome: true,\n      loggedIn: this.state.loggedIn,\n      doLogin: this.doLogin,\n      doLogout: this.doLogout,\n      goCuenta: () => this.goTo('cuenta'),\n      accessDisplay: this.state.loggedIn ? 'none' : 'flex',\n      avatarDisplay: this.state.loggedIn ? 'flex' : 'none',\n      calMonthLabel: monthNames[calMonth] + ' ' + calYear,\n      calCells, calWeekdays,\n      calPrevMonth: () => this.shiftCalMonth(-1),\n      calNextMonth: () => this.shiftCalMonth(1),\n      eventFilterBg, eventFilterColor, eventFilterSet,\n      showPitbullCard,\n      loginColumns: loginTwoCol ? '1fr 1fr' : '1fr',\n      loginInfoDisplay: loginTwoCol ? 'flex' : 'none',\n      loginFormJustify: loginTwoCol ? 'flex-start' : 'center',\n\n      goHome: () => this.goTo('home'),\n      goAfiliacion: () => this.goTo('afiliacion'),\n      goPitbull: () => this.goTo('pitbull'),\n      goEventos: () => this.goTo('eventos'),\n      goResultados: () => this.goTo('resultados'),\n      goReglamento: () => this.goTo('reglamento'),\n      goComunidad: () => this.goTo('comunidad'),\n      goFaq: () => this.goTo('faq'),\n      goContacto: () => this.goTo('contacto'),\n      goLogin: () => this.goTo('login'),\n\n      desktopNavDisplay: this.state.isMobile ? 'none' : 'flex',\n      mobileButtonDisplay: this.state.isMobile ? 'flex' : 'none',\n      mobilePanelPointer: this.state.menuOpen ? 'auto' : 'none',\n      backdropAlpha: this.state.menuOpen ? 0.55 : 0,\n      drawerTransform: this.state.menuOpen ? 'translateX(0)' : 'translateX(100%)',\n      stopPropMenu: (e) => e.stopPropagation(),\n      toggleMenu: this.toggleMenu,\n      navColor: {\n        afiliacion: p === 'afiliacion' ? on : off,\n        eventos: activeGroup === 'eventos' ? on : off,\n        recursos: activeGroup === 'recursos' ? on : off,\n      },\n\n      dropdownEventosOpen: dropdownOpen === 'eventos',\n      dropdownRecursosOpen: dropdownOpen === 'recursos',\n      toggleDropdownEventos: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.toggleDropdown('eventos'); },\n      toggleDropdownRecursos: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.toggleDropdown('recursos'); },\n      chevronEventos: dropdownOpen === 'eventos' ? 'rotate(-135deg)' : 'rotate(45deg)',\n      chevronRecursos: dropdownOpen === 'recursos' ? 'rotate(-135deg)' : 'rotate(45deg)',\n\n      indicatorLeft: this.state.indicator.left + 'px',\n      indicatorWidth: this.state.indicator.width + 'px',\n      indicatorOpacity: this.state.indicator.visible ? 1 : 0,\n\n      navPaddingV: this.state.navScrolled ? '13px' : '19px',\n      navShadow: this.state.navScrolled ? '0 12px 32px rgba(0,0,0,.4)' : '0 4px 20px rgba(0,0,0,.22)',\n      navBg: this.state.navScrolled ? 'oklch(8% 0.006 260 / 0.98)' : 'oklch(10% 0.006 260 / 0.94)',\n\n      faqOpen, faqToggle, faqChevron,\n\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      setAtleta: () => this.setMotivo('atleta'),\n      setGimnasio: () => this.setMotivo('gimnasio'),\n      setOrganizacion: () => this.setMotivo('organizacion'),\n      setPluUsa: () => this.setMotivo('pluusa'),\n      send: this.send,\n      pillBg: { atleta: a.bg, gimnasio: g.bg, organizacion: o.bg, pluusa: pu.bg },\n      pillColor: { atleta: a.color, gimnasio: g.color, organizacion: o.color, pluusa: pu.color },\n      pillBorder: { atleta: a.border, gimnasio: g.border, organizacion: o.border, pluusa: pu.border },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
